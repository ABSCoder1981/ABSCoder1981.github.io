# /etc/nginx/sites-available/ashiyana-staging.conf
# Staging: https://staging.ashiyanarealestate.in — for review before launch.
# Kept out of search engines (noindex build + X-Robots-Tag). To put it behind a password, create
#   sudo htpasswd -c /etc/nginx/.htpasswd-ashiyana-staging review
# and uncomment the two auth_basic lines below.

server {
    listen 80;
    listen [::]:80;
    server_name staging.ashiyanarealestate.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://staging.ashiyanarealestate.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.ashiyanarealestate.in;

    ssl_certificate     /etc/letsencrypt/live/staging.ashiyanarealestate.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ashiyanarealestate.in/privkey.pem;
    include /etc/nginx/snippets/ashiyana-ssl.conf;

    # symlink to the current release, switched by deploy/deploy.sh
    root /var/www/ashiyana-website/staging;
    access_log /var/log/nginx/ashiyana-staging.access.log;
    error_log  /var/log/nginx/ashiyana-staging.error.log warn;

    # auth_basic "Ashiyana staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-ashiyana-staging;

    set $ashiyana_robots "noindex, nofollow";

    include /etc/nginx/snippets/ashiyana-site.conf;
}
