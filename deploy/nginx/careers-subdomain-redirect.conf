# /etc/nginx/sites-available/ashiyana-prod-careers
# careers.ashiyanarealestate.in → https://www.ashiyanarealestate.in/careers (same path), since launch on 2026-10-29.
# The portal itself is now built into the website (deploy/deploy.sh). Original config: /root/ashiyana-prod-careers.bak-*

server {
    listen 443 ssl; # managed by Certbot
    server_name careers.ashiyanarealestate.in;
    ssl_certificate /etc/letsencrypt/live/careers.ashiyanarealestate.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/careers.ashiyanarealestate.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Phones that installed the old careers app keep a cached copy (service worker). Its next update check
    # gets this script, which removes it and reloads, so they land on the redirect below.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.registration.unregister().then(()=>self.clients.matchAll({type:'window'})).then(cs=>cs.forEach(c=>c.navigate(c.url)))));";
    }

    location = / { return 301 https://www.ashiyanarealestate.in/careers; }
    location / { return 301 https://www.ashiyanarealestate.in/careers$request_uri; }
}

server {
    listen 80;
    server_name careers.ashiyanarealestate.in;
    location = / { return 301 https://www.ashiyanarealestate.in/careers; }
    location / { return 301 https://www.ashiyanarealestate.in/careers$request_uri; }
}
