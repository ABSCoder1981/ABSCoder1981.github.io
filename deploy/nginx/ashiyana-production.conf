# /etc/nginx/sites-available/ashiyana-production.conf
# Production: https://www.ashiyanarealestate.in  (apex and http redirect to it)
# Requires the Let's Encrypt certificate for both names (see deploy/setup-vps.sh).

limit_req_zone $binary_remote_addr zone=ashiyana_api:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ashiyanarealestate.in www.ashiyanarealestate.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.ashiyanarealestate.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ashiyanarealestate.in;

    ssl_certificate     /etc/letsencrypt/live/ashiyanarealestate.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashiyanarealestate.in/privkey.pem;
    include /etc/nginx/snippets/ashiyana-ssl.conf;

    return 301 https://www.ashiyanarealestate.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ashiyanarealestate.in;

    ssl_certificate     /etc/letsencrypt/live/ashiyanarealestate.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashiyanarealestate.in/privkey.pem;
    include /etc/nginx/snippets/ashiyana-ssl.conf;

    root /var/www/ashiyana-website/production;  # symlink to the current release, switched by deploy/deploy.sh
    set $ashiyana_robots "";
    access_log /var/log/nginx/ashiyana-production.access.log;
    error_log  /var/log/nginx/ashiyana-production.error.log warn;

    # Coarse flood protection in front of the API's own 5-per-hour limit
    location = /api/enquiry {
        limit_req zone=ashiyana_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    include /etc/nginx/snippets/ashiyana-site.conf;
}
