# Response headers for the careers portal (/careers). nginx does not inherit add_header into a location
# that sets its own, so every careers location includes this file.
add_header X-Robots-Tag $ashiyana_robots always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://sepajfewzzalkidmsylc.supabase.co; connect-src 'self' https://sepajfewzzalkidmsylc.supabase.co wss://sepajfewzzalkidmsylc.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
