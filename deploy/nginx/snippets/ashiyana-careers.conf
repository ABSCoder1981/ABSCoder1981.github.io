# Careers portal at /careers: the React app from ashiyana-crm/careers, built with CAREERS_BASE=/careers/
# and deployed inside the site's release folder (web root + /careers/). Included by ashiyana-site.conf.
# It talks to Supabase directly (data, auth, résumé storage), so it has its own Content-Security-Policy.

location = /careers {
    try_files /careers/index.html =404;
    include /etc/nginx/snippets/ashiyana-careers-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Hashed JS/CSS: cache for a year
location ^~ /careers/assets/ {
    include /etc/nginx/snippets/ashiyana-careers-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# App shell, service worker, manifest and every in-app route (/careers/jobs/…): always revalidated,
# so a new careers deploy reaches people straight away
location ^~ /careers/ {
    include /etc/nginx/snippets/ashiyana-careers-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /careers/index.html;
}
