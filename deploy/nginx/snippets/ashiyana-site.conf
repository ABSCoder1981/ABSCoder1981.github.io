# Shared rules for the Ashiyana static site (production and staging).
# Included inside each HTTPS server block after `root` is set.

index index.html;
charset utf-8;

# ---- Compression ----
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           text/javascript image/svg+xml application/manifest+json application/ld+json;
# Brotli: uncomment if the nginx brotli module is installed (apt: libnginx-mod-http-brotli-filter)
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/xml application/json application/javascript text/javascript image/svg+xml;

# $ashiyana_robots is set per site: empty on production (header omitted), "noindex, nofollow" on staging.
# It is repeated in every location that has add_header, because nginx does not inherit add_header into those.
add_header X-Robots-Tag $ashiyana_robots always;

# ---- Security headers (also repeated in locations that set their own add_header) ----
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Astro inlines small hydration scripts, hence 'unsafe-inline'. GA4 needs googletagmanager + google-analytics.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ---- 301s from the old Shopify site ----
location = /pages/contact                { return 301 /contact; }
location = /pages/sanaswadi-landing-page { return 301 /projects/sanaswadi-industrial-land; }
location = /blogs/news                   { return 301 /; }
location ^~ /blogs/                      { return 301 /; }
location ^~ /collections/                { return 301 /; }
location ^~ /products/                   { return 301 /; }
location = /index                        { return 301 /; }
location = /index.html                   { return 301 /; }
# The About page was removed (its content is on the home page)
location = /about                        { return 301 /; }

# Canonical URLs: no trailing slash, no .html
rewrite ^/(.+)/$ /$1 permanent;
if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) {
    return 301 /$1$2;
}

# ---- Careers portal (/careers) ----
include /etc/nginx/snippets/ashiyana-careers.conf;

# ---- Enquiry API (Node, systemd: ashiyana-api) ----
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so clients can't spoof the rate-limit key
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
    limit_except GET POST { deny all; }
}

# ---- Hashed build assets: cache for a year ----
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag $ashiyana_robots always;
    access_log off;
    try_files $uri =404;
}

# Icons, OG image, manifest: a day
location ~* \.(?:ico|png|svg|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag $ashiyana_robots always;
    try_files $uri =404;
}

# ---- Pages: clean URLs (/kothrud → kothrud.html), short cache so content edits show quickly ----
location / {
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag $ashiyana_robots always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

# Never serve dotfiles
location ~ /\. {
    deny all;
}
