name: Update code copy on the VPS

# Push to main -> tell the VPS to update its read-only code copy at /srv/ashiyana/AshiyanaWebsite.
# The key in VPS_SYNC_KEY can only start that update (see deploy/setup-repo-sync.sh).
# This never changes the live site. If a run fails, the VPS catches up at the next push or server restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-vps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the update on the VPS
        env:
          VPS_SYNC_KEY: ${{ secrets.VPS_SYNC_KEY }}
          VPS_SYNC_PUBKEY: AAAAC3NzaC1lZDI1NTE5AAAAIEz6WjS17F/rq/49NhY9WEqgkswKOZhuzgQ81ibTsZ83
          VPS_HOST_KEY: 139.84.147.129 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPUCxvX8jGEOuxNrZzWCKdsy6lbl5NHEGMYXC6//I1ak
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$VPS_SYNC_KEY" ]; then
            echo "::error::The VPS_SYNC_KEY secret is empty or missing"
            exit 1
          fi
          # Pasting can add invisible line endings or lose the line breaks, so rebuild the key's layout
          begin='-----BEGIN OPENSSH PRIVATE KEY-----'
          end='-----END OPENSSH PRIVATE KEY-----'
          body="$(printf '%s' "$VPS_SYNC_KEY" | sed -e "s/$begin//" -e "s/$end//" | tr -d ' \t\r\n')"
          { printf '%s\n' "$begin"; printf '%s\n' "$body" | fold -w 70; printf '%s\n' "$end"; } > ~/.ssh/sync_key
          chmod 600 ~/.ssh/sync_key
          # Check the key here first, so a bad one never counts as a failed login on the VPS
          if ! actual="$(ssh-keygen -y -f ~/.ssh/sync_key 2>/dev/null)"; then
            # Only the shape of the secret, never its content
            has_begin=no; has_end=no
            case "$VPS_SYNC_KEY" in *"$begin"*) has_begin=yes ;; esac
            case "$VPS_SYNC_KEY" in *"$end"*) has_end=yes ;; esac
            lines="$(printf '%s\n' "$VPS_SYNC_KEY" | wc -l)"
            echo "::error::VPS_SYNC_KEY is not a readable private key (lines=$lines chars=${#VPS_SYNC_KEY} body=${#body} begin=$has_begin end=$has_end)"
            exit 1
          fi
          if [ "$(printf '%s' "$actual" | cut -d' ' -f2)" != "$VPS_SYNC_PUBKEY" ]; then
            echo "::error::VPS_SYNC_KEY is a valid key, but not the one the VPS expects"
            exit 1
          fi
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/sync_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes ashiyana-sync@139.84.147.129
